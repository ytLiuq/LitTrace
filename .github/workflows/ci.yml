name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: littrace
          POSTGRES_USER: littrace
          POSTGRES_PASSWORD: littrace
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U littrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          LITTRACE_POSTGRES_DSN: postgresql://littrace:littrace@localhost:5433/littrace
        run: |
          uv run pytest tests/unit tests/domain tests/api tests/adapters tests/eval \
            -m "not live and not integration" --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: uv run ruff check src tests
