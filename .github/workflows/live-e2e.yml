name: live-e2e

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run LITTRACE_LIVE_TESTS=1 paths"
        type: boolean
        default: true
      run_integration:
        description: "Run LITTRACE_RAG_* integration paths (needs pgvector + minio + embedding endpoint)"
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1"  # weekly Monday 06:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: littrace
          POSTGRES_USER: littrace
          POSTGRES_PASSWORD: littrace
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U littrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: littrace
          MINIO_ROOT_PASSWORD: littrace123
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Live E2E
        if: ${{ inputs.run_live != false && github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
        env:
          LITTRACE_LIVE_TESTS: "1"
          LITTRACE_POSTGRES_DSN: postgresql://littrace:littrace@localhost:5433/littrace
        run: |
          uv run pytest tests/live -m live --tb=short -v || \
            echo "::warning::live tests failed; check LITTRACE_LIVE_* env"

      - name: Integration E2E
        if: ${{ inputs.run_integration != false }}
        env:
          LITTRACE_RAG_POSTGRES_DSN: postgresql://littrace:littrace@localhost:5433/littrace
          LITTRACE_RAG_EMBEDDING_PROVIDER: "openai"
          # LITTRACE_RAG_EMBEDDING_BASE_URL / _API_KEY / _MODEL must be
          # supplied as repository secrets; otherwise the integration
          # path self-skips.
        run: |
          uv run pytest tests/integration -m integration --tb=short -v || \
            echo "::warning::integration tests skipped (missing embedding secrets) or failed"
