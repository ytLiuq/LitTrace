storage:
  paper_library_dir: "./data/papers"
  metadata_dir: "./data/metadata"
  cache_dir: "./data/cache"
  sessions_dir: "./sessions"
  workspace_snapshot_limit: 30

artifact_storage:
  backend: "local"  # local | s3 (MinIO-compatible)
  local_root: "./data/artifacts"
  bucket: null
  endpoint_url: null
  region: null
  path_prefix: ""

metadata_store:
  backend: "postgres"
  postgres_dsn: "postgresql://littrace:littrace@localhost:5433/littrace"
  schema_name: "littrace"
  connect_timeout_seconds: 5

rag:
  enabled: false
  backend: "pgvector"
  postgres_dsn: "postgresql://littrace:littrace@localhost:5433/littrace"
  schema_name: "littrace_rag"
  collection_prefix: "littrace"
  embedding_provider: "openai-compatible"
  embedding_base_url: "https://api.openai.com/v1"
  embedding_api_key: "your-openai-api-key"
  embedding_model: "text-embedding-3-small"
  embedding_dimension: 1536
  chunk_target_tokens: 700
  chunk_overlap_tokens: 120
  top_k: 12
  refresh_frequency: "daily"
  auto_refresh_enabled: false
  # Daily-update auto-download: when on, the daily RAG job pulls new OA
  # PDFs automatically but writes them only to the artifact object store
  # (artifact_storage). User-initiated paths (chat /downloads/execute,
  # attach-pdf) are unaffected and continue to write both local + storage.
  auto_download_open_access: true
  login_required_policy: "queue_only"

figure_enrichment:
  enabled: false
  # Use a vision-capable OpenAI-compatible endpoint/model.
  base_url: null
  api_key: null
  model: null
  max_figures_per_job: 20
  min_confidence: 0.65

cache_policy:
  default_ttl_seconds: 86400
  allow_stale_on_source_failure: true

publication_policy:
  strict_all_claims: true
  require_publishable_claim: true

api:
  user_agent: "LitTrace/0.1 mailto:your-email@example.com"
  openalex_api_key: null
  unpaywall_email: "your-email@example.com"
  crossref_mailto: "your-email@example.com"
  request_timeout_seconds: 20
  enable_live_search: true
  enable_arxiv: true

cdp_downloader:
  cdp_url: "http://127.0.0.1:19222"
  chrome_executable: null
  # LitTrace uses a private Chrome profile under ./data/chrome-cdp so it
  # never collides with the user's day-to-day Chrome instance (whose
  # user-data-dir is locked while it is running). Set to null to fall
  # back to the platform default Chrome user-data-dir (only safe when
  # your normal Chrome is not running). The first time the profile is
  # created LitTrace prints a one-off instruction to sign in to each
  # publisher you want full-text access to.
  chrome_user_data_dir: "./data/chrome-cdp"
  chrome_profile_name: "Default"
  remote_debugging_port: 19222
  # When true, LitTrace launches its private Chrome on demand so the
  # user does not need to run `littrace setup-browser --launch` before
  # every session. Disable here (or set LITTRACE_AUTO_LAUNCH_CHROME=false)
  # to opt out.
  auto_launch_chrome: true
  cloudflare_wait_seconds: 60
  user_action_wait_seconds: 30
  command_timeout_seconds: 60
  repository_download_timeout_seconds: 120
  websocket_reconnect_attempts: 3

browser:
  # Legacy BrowserAct settings. Publisher PDF download uses cdp_downloader.
  required: false

paper_download:
  mode: "ask_each_time"
  organize_by: "year_doi"
  filename_template: "{year}_{first_author}_{short_title}_{doi_hash}.pdf"
  save_metadata_even_if_pdf_skipped: false
  max_concurrent_downloads: 3
  allow_requires_login_download: true

parsing:
  default_parser: "paddleocr"
  docling_workers: 2
  preferred_engines:
    - "docling"
    - "paddleocr"
    - "marker"
    - "grobid"
  docling:
    export_markdown: true
    extract_tables: true
    extract_figures: true
    describe_figures: false
  paddleocr:
    lang: "en"
    use_angle_cls: true
    pdf_render_scale: 2.0
    max_pages: null
    ocr_batch_size: 4

literature_context:
  visible_to_user: true
  default_year_min: 2023
  default_recent_year_min: 2023
  preferred_disciplines:
    - "materials science"
    - "chemistry"
  preferred_publishers:
    - "Wiley"
    - "American Chemical Society"
    - "Springer Nature"
    - "Royal Society of Chemistry"
    - "Elsevier"
    - "MDPI"
    - "Nature Portfolio"
  preferred_journals:
    - "Advanced Materials"
    - "Advanced Functional Materials"
    - "ACS Nano"
    - "Nano Letters"
    - "Chemistry of Materials"
    - "Nature Materials"
    - "Nature Communications"
    - "Small"
    - "Materials Today"
    - "Sensors and Actuators"
    - "Polymers"
    - "Nanomaterials"

eval:
  golden_set_dir: "./eval/golden"
  rag_golden_set_dir: "./eval/rag_golden"
  traces_dir: "./eval/traces"

# Interactive execution runtime. Keep `legacy` during rollout; switch to
# `codex_app_server` to route synthesis/Q&A and the first controlled mutation
# (`set_download_selection`) through Codex. Other domain writes remain legacy.
agent_runtime:
  mode: "codex_app_server"  # legacy | codex_app_server
  codex_command:
    - "/Applications/ChatGPT.app/Contents/Resources/codex"
    - "app-server"
  # Raw TOML values passed as repeated `codex app-server -c key=value`.
  # Force the Codex App Server to talk to OpenAI directly instead of the
  # provider declared in ~/.codex/config.toml (which on internal machines
  # can be a corporate gateway that rejects ChatGPT OAuth access tokens
  # with ``无效的令牌``).
  #
  # ``model`` is intentionally not overridden: the Codex CLI's ``-c model=``
  # override is silently ignored when the active session authenticates
  # via ChatGPT OAuth (it raises ``"The '<name>' model is not supported
  # when using Codex with a ChatGPT account."``), and the user's
  # ``~/.codex/config.toml`` default (``gpt-5.6-sol``) is already a
  # ChatGPT-OAuth-compatible choice that the host's ChatGPT subscription
  # supports. Service reuse (see ``ShellController._prime_service``)
  # cuts subsequent turn latency from ~11 s cold start to ~6 s.
  codex_config_overrides:
    model_provider: '"openai"'
  # `isolated` keeps a private CODEX_HOME under ./data/codex-home so the
  # project's Codex state, threads, and MCP servers stay isolated from
  # the user's default ~/.codex. Authenticate this home once with
  # `CODEX_HOME=./data/codex-home codex login`.
  # `shared` reuses ~/.codex (ChatGPT OAuth tokens written by
  # ``codex login`` are honoured). Required on codex 0.149.x where the
  # app-server does not yet read OAuth tokens from an isolated home.
  codex_home_mode: "shared"  # isolated | shared
  codex_home: "./data/codex-home"
  scratch_root: "./data/codex-runtime"
  startup_timeout_seconds: 20
  request_timeout_seconds: 60
  turn_timeout_seconds: 300
  fallback_to_legacy: true
  mcp_server_name: "littrace"
