[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "littrace"
version = "0.1.0"
description = "Traceable materials and chemistry research agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
  "websocket-client>=1.8",
]

[project.optional-dependencies]
parsers = [
  "docling>=2.70",
  "paddleocr>=2.8",
  "paddlepaddle>=3.3",
  "pypdfium2>=4.30",
]
mcp = [
  "mcp>=1.0",
]
rag = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
]
storage = [
  "boto3>=1.34",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
littrace = "littrace.cli:main"
littrace-tui = "littrace.tui:main"
littrace-window = "littrace.window:main"
littrace-mcp = "littrace.mcp_server:main"

[tool.ruff]
line-length = 100
target-version = "py311"
