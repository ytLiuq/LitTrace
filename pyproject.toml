[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "littrace"
version = "0.1.0"
description = "Traceable materials and chemistry research agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
  "websocket-client>=1.8",
]

[project.optional-dependencies]
parsers = [
  "docling>=2.70",
  "paddleocr[doc-parser]>=3.7",
  "paddlepaddle>=3.3",
  "pypdfium2>=4.30",
]
mcp = [
  "mcp>=1.0,<2.0",
]
rag = [
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
]
storage = [
  "boto3>=1.34",
]
gui-qt = [
  # PySide6 ships with QtWebEngine (Chromium) on macOS/Windows and Linux
  # x86_64. The Qt wheels are universal2 on macOS, so the same pip
  # command covers Apple Silicon and Intel. See
  # https://doc.qt.io/qt-6/qtwebengine-platform-notes.html for platform
  # requirements.
  "PySide6>=6.7",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "fpdf2>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
littrace = "littrace.cli:main"
littrace-tui = "littrace.tui:main"
littrace-qt = "littrace.window_qt:main"
littrace-mcp = "littrace.mcp_server:main"

# Plugin entry-point group. Third-party packages may declare a
# ``[project.entry-points."littrace.skills"]`` block in their own
# pyproject.toml. Each entry point must resolve to ``register(registry)``.
# Built-in skills self-register at import time via ``littrace.skills``
# sub-packages — they do not need entry points.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
markers = [
  "unit: pure-logic unit tests, no I/O",
  "domain: domain integration tests (real components, light fixtures)",
  "api: HTTP/CLI/TUI surface tests",
  "adapters: external adapter integration (docling, paddleocr, browser, downloads)",
  "live: opt-in tests that access real publishers and local browser/CDP services; gated by LITTRACE_LIVE_TESTS / LITTRACE_LIVE_DAILY_TESTS / LITTRACE_LIVE_DOWNLOAD_TESTS",
  "integration: opt-in tests that need pgvector + minio + real PDF; gated by LITTRACE_RAG_POSTGRES_DSN + LITTRACE_RAG_EMBEDDING_* env",
  "eval: evaluation harness tests",
]
testpaths = ["tests"]
